<mat-card class="register-card">
  <mat-card-header>
    <mat-card-title>Welcome to AI Learning Platform 🧠</mat-card-title>
    <mat-card-subtitle>Register to start learning</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Full Name</mat-label>
      <input matInput [(ngModel)]="name" placeholder="Israel Israeli">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Phone Number</mat-label>
      <input matInput [(ngModel)]="phone" placeholder="0501234567">
    </mat-form-field>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="register()">
      Register & Start Learning
    </button>
  </mat-card-actions>
</mat-card>
